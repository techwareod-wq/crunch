# Production compose — pulls prebuilt images from ECR instead of building.
# Lives on the server next to a .env file defining ECR_REGISTRY and AWS_REGION
# (see deploy/README.md). IMAGE_TAG defaults to latest; pin a build tag (main-<sha> / integration-<sha>) to roll back.
services:
  crunch:
    image: ${ECR_REGISTRY}/crunch:${IMAGE_TAG:-latest}
    container_name: crunch
    restart: unless-stopped
    env_file: /etc/crunch/crunch.env
    ports:
      - "127.0.0.1:3090:3090"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3090/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1g
