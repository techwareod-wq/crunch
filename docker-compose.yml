services:
  crunch:
    build:
      context: .
      dockerfile: Dockerfile
    image: crunch:latest
    container_name: crunch
    restart: unless-stopped
    env_file: /etc/crunch/crunch.env
    ports:
      - "127.0.0.1:3090:3090"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3090/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1g
