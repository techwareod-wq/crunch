# Local stand-in for AWS SQS (ElasticMQ). Queues live in memory and reset on restart.
include classpath("application.conf")

node-address {
  protocol = http
  host = localhost
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "127.0.0.1"
  sqs-limits = strict
}

rest-stats {
  enabled = false
}

queues {
  crunch-local-primary {
    defaultVisibilityTimeout = 600 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "crunch-local-dlq"
      maxReceiveCount = 5
    }
  }
  crunch-local-dlq {}
}
