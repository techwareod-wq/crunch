server:
  port: "3090"
  defaultDBName: "crunchDB"
  awsRegion: "ap-south-1"
  # Only requests whose Host header matches are served; direct-IP requests
  # (Host = the IP) are rejected. Loopback and /health are always allowed.
  # TODO: set to the production API host once the domain exists, e.g.
  #   allowedHosts:
  #     - "api.crunch.example"
  allowedHosts: []

# Operational tuning for the /v1/admin surface. Access comes only from a
# user's role + permissions (internal/authz); nothing here grants admin.
admin:
  # Page-size bounds for the admin list endpoints.
  pagination:
    usersDefault: 20
    usersMax: 100
    auditDefault: 50
    auditMax: 200

async:
  workerCount: 40
  maxRetries: 3
  shutdownSeconds: 60

sqs:
  waitTimeSeconds: 20
  visibilityTimeout: 600
  maxMessagesPerBatch: 10  # SQS hard-caps ReceiveMessage at 10

idempotency:
  # Retention of a dedupe ledger row. Must exceed the longest redelivery window
  # (max SQS retention of 14 days plus retry churn). 384h = 16 * 24h.
  ttlHours: 384

webhooks:
  maxClerkBodyBytes: 1048576    # 1 << 20

s3:
  presignPutExpirySeconds: 3600        # 60 minutes
  presignMultipartExpirySeconds: 5400  # 90 minutes
  maxConcurrency: 10

# Media link lifetimes (D-015/D-062). Buckets are env vars
# (AWS_S3_PUBLIC_BUCKET / AWS_S3_PRIVATE_BUCKET); no ACLs anywhere.
storage:
  privateLinkSeconds: 300  # 5 min presigned GET for staff-only docs
  uploadLinkSeconds: 900   # 15 min presigned PUT for uploads

llm:
  anthropic:
    apiURL: "https://api.anthropic.com/v1/messages"
    apiVersion: "2023-06-01"
    requestTimeoutSeconds: 540  # per-call HTTP timeout; keep under sqs.visibilityTimeout (600)

apis:
  # Shared http.Client used by ApiClient.
  httpClient:
    timeoutSeconds: 60
  # Google Geocoding (key: GOOGLE_MAPS_API_KEY). Draft saves geocode the
  # address; search resolves place names (D-061, D-078).
  geocode:
    apiURL: "https://maps.googleapis.com/maps/api/geocode/json"
    timeoutMillis: 800

cron:
  # Scheduler sweep period. Must be <= the finest job interval; every job's
  # catch-up window must exceed it.
  tickSeconds: 300
  # Takeover threshold: an occurrence claim not marked completed within this
  # is presumed dead (node crashed mid-dispatch) and re-run by a later tick.
  claimStaleSeconds: 600
  # IANA fallback zone for schedule validation and users with no stored zone.
  defaultZone: "Asia/Kolkata"
  # Per-job switches, keyed by job name (jobs defined in internal/cron/jobs_*.go).
  jobs:
    # Nightly re-evaluation of any warehouse whose projection lags the
    # current rulesVersion (D-040 safety net). Off until needed.
    attributes_recompute_safety_net:
      enabled: false
    # Daily media cleanup: unconfirmed uploads and long-unreferenced media
    # (spec 03). Switched on at launch (OP-06).
    catalog_media_gc:
      enabled: false
    # Nightly search analytics rollup (spec 07): yesterday plus any missed
    # days still inside the 90-day raw window. Switched on at launch (OP-06).
    analytics_rollup_daily:
      enabled: false
      at: "00:20"

# WarehouseHub feature tunables. Each service adds its own sub-block
# (attributes, catalog, search, aisearch, enquiries, analytics) as it lands.
warehousehub:
  # Base URLs used to build links in emails, JSON-LD and the sitemap.
  # TODO(D-005): set once the domain/branding is decided.
  publicBaseURL: ""
  adminBaseURL: ""
  attributes:
    # Other instances pick up a tree/industry write within this many seconds
    # (the instance serving the write reloads immediately).
    cacheRefreshSeconds: 60
    # Warehouses per attributes.recompute_batch message.
    recomputeBatchSize: 200
  catalog:
    # An approver may approve their own submission (D-053).
    allowSelfApprove: false
    # Media limits (D-062).
    maxPhotos: 30
    maxPhotoBytes: 10485760   # 10 MB
    maxDocBytes: 20971520     # 20 MB
    # Media GC: unconfirmed uploads after this many hours; unreferenced
    # media after this many days.
    mediaGcPendingHours: 24
    mediaGcUnreferencedDays: 30
    # Admin list page sizes.
    listDefault: 25
    listMax: 100
    # Public slugs / sitemap page size.
    publicPageSize: 1000
    # Max revisions per bulk-approve request.
    bulkApproveMax: 100
  search:
    # Default radius per country (D-070) and the expansion rings in km (D-071).
    defaultRadiusKm:
      IN: 25
      default: 25
    radiusSteps: [25, 50, 100, 250]
    # Stop expanding once a ring holds this many listings.
    minResults: 3
    pageLimitDefault: 20
    pageLimitMax: 50
    # Price filter currency per country (no FX, D-058).
    currency:
      IN: INR
    # Resolved locations are reused this long (D-078). TODO: verify Google's
    # caching terms before launch.
    geocodeCacheHours: 720
    # Geocoder circuit breaker.
    breakerFailures: 5
    breakerOpenSeconds: 60
  aisearch:
    # Feature flag. Off: /v1/public/search/ai and reembed-all return 404,
    # approve queues no embed jobs. Structured search is unaffected.
    enabled: false
    # Extraction model (D-080) and its hard deadline; past it the search runs
    # on the regex pre-parse (D-088).
    model: claude-sonnet-5
    maxTokens: 1024
    llmDeadlineMillis: 2200
    maxQueryChars: 300
    # Fewer results than this after radius expansion adds similar matches
    # (D-084).
    fallbackThreshold: 5
    fallbackLimit: 10
    # Embeddings (key: VOYAGE_API_KEY). Changing the model or dims needs a
    # new Atlas vector index and a reembed-all.
    voyageURL: "https://api.voyageai.com/v1/embeddings"
    embedModel: voyage-3.5-lite
    embedDims: 1024
    embedTimeoutMillis: 600
    # Atlas Vector Search index (deploy/ATLAS_INDEXES.md).
    vectorIndex: wh_embedding
    vectorNumCandidates: 200
  enquiries:
    # Free-text requirement limit (D-102), in characters.
    messageMaxLen: 4000
    # Inbox page sizes.
    listDefault: 25
    listMax: 100
    # Max rows in one CSV export.
    exportMax: 10000
  analytics:
    # Calendar days (rollups, dashboards) are local to this zone.
    zone: "Asia/Kolkata"
    # Top / zero-result query lists.
    topDefault: 50
    topMax: 200
    # Raw search log page sizes.
    logDefault: 50
    logMax: 200
