name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a master build mid-push; superseded PR runs are safe to kill.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  id-token: write # OIDC token for assuming the AWS role

env:
  ECR_REPO: crunch
  # master → :latest. The SHA tag below is the immutable rollback target.
  MUTABLE_TAG: latest
  # Immutable per-build tag (master-<sha>); deploys pin to it.
  BUILD_TAG: ${{ github.ref_name }}-${{ github.sha }}

jobs:
  test:
    name: Test (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  build-and-push:
    name: Build & push to ECR
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build & push crunch
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ env.MUTABLE_TAG }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ env.BUILD_TAG }}
          cache-from: type=gha,scope=crunch
          cache-to: type=gha,scope=crunch,mode=max

  deploy:
    name: Deploy on server (SSM)
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Pins IMAGE_TAG to this commit's build rather than :latest so a
      # concurrent later build can't be picked up mid-deploy.
      - name: Run deploy.sh on the instance
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "crunch ${GITHUB_REF_NAME} deploy ${GITHUB_SHA::12}" \
            --parameters '{"commands":["IMAGE_TAG=${{ env.BUILD_TAG }} /home/ec2-user/crunch-deploy/deploy.sh"],"executionTimeout":["900"]}' \
            --query Command.CommandId --output text)
          echo "SSM command id: $CMD_ID"

          STATUS=Pending
          for _ in $(seq 1 90); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut|DeliveryTimedOut) break ;; esac
          done

          echo "--- deploy output ---"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query 'join(`\n`, [`# stdout`, StandardOutputContent, `# stderr`, StandardErrorContent])' \
            --output text
          echo "Status: $STATUS"
          [ "$STATUS" = "Success" ]
