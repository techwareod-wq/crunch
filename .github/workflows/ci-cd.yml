name: CI/CD

on:
  push:
    branches: [main, integration]
  pull_request:
    branches: [main, integration]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a main build mid-push; superseded PR runs are safe to kill.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  id-token: write # OIDC token for assuming the AWS role

env:
  ECR_REPO_CENTRAL: central
  ECR_REPO_SIDECAR: central-sidecar
  # Both branches share the two ECR repos; the mutable tag tells them apart:
  # main → :latest, integration → :integration. SHA tags are unique either way.
  MUTABLE_TAG: ${{ github.ref_name == 'main' && 'latest' || github.ref_name }}
  # Immutable per-build tag, prefixed by branch so each environment's ECR
  # lifecycle rule keeps its own current + previous build (rollback target).
  BUILD_TAG: ${{ github.ref_name }}-${{ github.sha }}

jobs:
  test-central:
    name: Test central (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  test-sidecar:
    name: Test sidecar (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sidecar
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sidecar/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  build-and-push:
    name: Build & push to ECR
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/integration')
    needs: [test-central, test-sidecar]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build & push central
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO_CENTRAL }}:${{ env.MUTABLE_TAG }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO_CENTRAL }}:${{ env.BUILD_TAG }}
          cache-from: type=gha,scope=central
          cache-to: type=gha,scope=central,mode=max

      - name: Build & push sidecar
        uses: docker/build-push-action@v6
        with:
          context: sidecar
          push: true
          provenance: false
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO_SIDECAR }}:${{ env.MUTABLE_TAG }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO_SIDECAR }}:${{ env.BUILD_TAG }}
          cache-from: type=gha,scope=sidecar
          cache-to: type=gha,scope=sidecar,mode=max

  deploy:
    name: Deploy on server (SSM)
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      # main deploys to the production instance, integration to the integration one.
      INSTANCE_ID: ${{ github.ref_name == 'main' && vars.EC2_INSTANCE_ID || vars.EC2_INSTANCE_ID_INTEGRATION }}
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Pins IMAGE_TAG to this commit's build rather than :latest so a
      # concurrent later build can't be picked up mid-deploy.
      - name: Run deploy.sh on the instance
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "central ${GITHUB_REF_NAME} deploy ${GITHUB_SHA::12}" \
            --parameters '{"commands":["IMAGE_TAG=${{ env.BUILD_TAG }} /home/ec2-user/central-deploy/deploy.sh"],"executionTimeout":["900"]}' \
            --query Command.CommandId --output text)
          echo "SSM command id: $CMD_ID"

          STATUS=Pending
          for _ in $(seq 1 90); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut|DeliveryTimedOut) break ;; esac
          done

          echo "--- deploy output ---"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query 'join(`\n`, [`# stdout`, StandardOutputContent, `# stderr`, StandardErrorContent])' \
            --output text
          echo "Status: $STATUS"
          [ "$STATUS" = "Success" ]
