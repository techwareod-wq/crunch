name: CI

on:
  push:
    branches: [main, integration]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt (formatting gate)
        run: |
          # Fails the build if any tracked Go file is not gofmt-clean.
          gofmt -l . | tee /dev/stderr | (! read)

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./...
